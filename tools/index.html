    :root {

      transition:

        border-color 150ms ease,
        transform 140ms ease,
        box-shadow 140ms ease,
        opacity 140ms ease;
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      will-change: transform;
    }

    .tools-action-btn {
      background: color-mix(in oklab, var(--muted) 85%, transparent);
      color: var(--foreground);
    }

    .tools-action-btn:hover {
      background: color-mix(in oklab, var(--muted) 100%, transparent);
    }

    .tools-action-btn:disabled {
      opacity: 0.7;
      cursor: default;
    }

    .tools-busy-btn[data-busy='true'],
    .tools-busy-btn[data-busy='true'] * {
      opacity: 0.7;
      cursor: pointer !important;
    }

    .tools-secondary-btn {
      background: color-mix(in oklab, var(--muted) 85%, transparent);
      color: var(--foreground);
      border-color: var(--border);
    }

    .tools-secondary-btn:hover {
      background: color-mix(in oklab, var(--muted) 100%, transparent);
    }

    .tools-action-btn:active,
    .tools-secondary-btn:active {
      transform: scale(0.98);

    .tools-swap-btn {
      padding-inline: 0.75rem;
      min-width: 2.5rem;
      justify-content: center;
    }

    /* ==============================
     * 文本框右上角拷贝按钮（通用样式）
     * 仅显示图标；hover 容器时淡入；点击后浮出 Copied! 徽标
     * ============================== */
    .tools-copy-wrap {
      position: relative;
      width: 100%;
    }

    .tools-copy-wrap > textarea {
      width: 100%;
      display: block;
    }

    .tools-copy-btn {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      z-index: 3;
      display: inline-flex;
      align-items: center;

      width: 2rem;
      height: 2rem;
      padding: 0;
      border: 1px solid color-mix(in oklab, var(--border) 92%, transparent);
      border-radius: 0.5rem;
      background: color-mix(in oklab, var(--background) 90%, transparent);
      color: var(--muted-foreground);
      backdrop-filter: blur(10px);
      box-shadow: 0 1px 2px color-mix(in oklab, black 8%, transparent);
      opacity: 0;
      pointer-events: none;
      transition:
        opacity 140ms ease,
        background-color 140ms ease,
        color 140ms ease,
        border-color 140ms ease;
    }

    .tools-copy-icon {
      flex: none;
    }

    .tools-copy-icon--copied {
      display: none;
    }

    /* hover 到文本框容器时显示按钮；按钮自己被 hover / focus 时保持显示 */
    .tools-copy-wrap:hover .tools-copy-btn,
    .diff-input-body:hover .tools-copy-btn,
    .json-copy-wrap:hover .tools-copy-btn,
    .tools-copy-btn:hover,
    .tools-copy-btn:focus-visible {
      opacity: 1;
      pointer-events: auto;
    }

    .tools-copy-btn:hover {
      background: color-mix(in oklab, var(--muted) 85%, transparent);
      color: var(--foreground);
    }

    .tools-copy-btn:focus-visible {
      outline: none;
      box-shadow:
        0 0 0 3px color-mix(in oklab, var(--ring) 45%, transparent),
        0 1px 2px color-mix(in oklab, black 10%, transparent);
    }

    /* 复制成功态：按钮持续可见，图标切到 check */
    .tools-copy-btn[data-copied='true'] {
      opacity: 1;
      pointer-events: auto;
      background: color-mix(in oklab, var(--primary) 14%, var(--background));
      color: var(--foreground);
      border-color: color-mix(in oklab, var(--primary) 45%, var(--border));
    }

    .tools-copy-btn[data-copied='true'] .tools-copy-icon--default {

    .tools-copy-btn {

        background-color 140ms ease,
        color 140ms ease,
        border-color 140ms ease,
        transform 120ms ease;

    .tools-highlight-code {
      display: block;
      min-height: 100%;
    }

    .tools-highlight-code,
    .tools-highlight-code * {
      font: inherit !important;
      font-family: inherit !important;
      font-size: inherit !important;
      font-style: inherit !important;
      font-weight: inherit !important;
      line-height: inherit !important;
      letter-spacing: inherit !important;
      word-spacing: inherit !important;
      font-kerning: inherit !important;
      font-variant-ligatures: inherit !important;
      font-feature-settings: inherit !important;
      font-synthesis-weight: inherit !important;
      white-space: inherit;
      tab-size: inherit;
      -moz-tab-size: inherit;
    }

    .tools-highlight-textarea {
      position: relative;
      z-index: 1;
      width: 100%;
      display: block;
      resize: vertical;
      box-sizing: border-box;
      padding: 0.75rem 1rem;
      background: transparent;
      color: transparent;
      caret-color: var(--foreground);
      font-family: var(--tools-editor-font-family);
      font-size: var(--tools-editor-font-size);
      line-height: var(--tools-editor-line-height);
      font-weight: 400;
      tab-size: 2;
      -moz-tab-size: 2;
      font-variant-ligatures: none;
      font-kerning: none;
      letter-spacing: 0;
      word-spacing: 0;
      font-synthesis-weight: none;
      white-space: pre-wrap;
      word-break: break-all;
      overflow-wrap: anywhere;
      /* 固定预留垂直滚动条空间，让 textarea 的内容区宽度无论是否出滚动条都与 pre 一致，

      overflow-y: auto;
      scrollbar-gutter: stable;
    }

    .tools-highlight-wrap.is-editing .tools-highlight-pre {
      opacity: 0;
    }

    .tools-highlight-wrap.is-editing .tools-highlight-textarea {
      color: var(--foreground);
      caret-color: var(--foreground);
    }

    .tools-highlight-wrap--nowrap .tools-highlight-pre {
      white-space: pre;
      word-break: normal;
      overflow-wrap: normal;
    }

    .tools-highlight-wrap--nowrap .tools-highlight-textarea {
      white-space: pre;
      word-break: normal;
      overflow-wrap: normal;
      overflow: auto;
    }

    .tools-btn-loader {
      align-items: center;
    }

    .tools-btn-loader.hidden {
      display: none;
    }

    .tools-btn-loader:not(.hidden) {
      display: inline-flex;
    }

    /* === Diff Input Editor === */
    .diff-input-wrap {
      display: flex;
      border: 1px solid var(--border);
      border-radius: 1rem;
      overflow: hidden;
      background: var(--background);
      height: 26rem;
      /* 下列 4 个属性是输入区高亮同步的关键，不要再在子元素里覆盖 */
      font-family: ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
      font-size: 13px;
      line-height: 20px;
      font-variant-ligatures: none;
      font-kerning: none;
      font-feature-settings: normal;
      text-rendering: geometricPrecision;
      letter-spacing: 0;
      tab-size: 2;
      -moz-tab-size: 2;
    }

    .diff-input-wrap:focus-within {
      border-color: var(--ring);
      box-shadow: 0 0 0 3px color-mix(in oklab, var(--ring) 50%, transparent);
    }

    .diff-input-gutter {
      width: 3.25rem;
      flex: none;
      overflow: hidden;
      border-right: 1px solid color-mix(in oklab, var(--border) 90%, transparent);
      background: color-mix(in oklab, var(--muted) 55%, transparent);
      color: var(--muted-foreground);
      user-select: none;
      height: 100%;
    }

    .diff-input-gutter-inner {
      padding: 10px 6px;
      font: inherit;
      text-align: right;
    }

    .diff-input-line-no {
      display: block;
      height: 20px;
      line-height: 20px;
    }

    .diff-input-body {
      flex: 1;
      min-width: 0;
      position: relative;
      height: 100%;
    }

    .diff-input-highlight,
    .diff-input-textarea {
      margin: 0;
      box-sizing: border-box;
      padding: 10px 12px;
      border: 0;
      font: inherit;
      font-variant-ligatures: inherit;
      font-kerning: inherit;
      font-feature-settings: inherit;
      letter-spacing: inherit;
      tab-size: inherit;
      -moz-tab-size: inherit;
      white-space: pre;
      word-break: normal;
      overflow-wrap: normal;
      word-spacing: 0;
    }

    .diff-input-highlight {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      background: transparent;
    }

    .diff-input-code,
    .diff-input-code * {
      font: inherit;
      font-variant-ligatures: inherit;
      font-kerning: inherit;
      font-feature-settings: inherit;
      letter-spacing: inherit;
      white-space: inherit;
      tab-size: inherit;
      -moz-tab-size: inherit;
      word-spacing: inherit;
    }

    .diff-input-code {
      display: block;
      min-height: 100%;
    }

    .diff-input-textarea {
      display: block;
      width: 100%;
      height: 100%;
      resize: none;
      overflow: auto;
      outline: none;
      background: transparent;
      color: transparent;
      caret-color: var(--foreground);
      -webkit-text-fill-color: transparent;
      position: relative;
      z-index: 1;
    }

    .diff-input-textarea::placeholder {
      color: var(--muted-foreground);
      -webkit-text-fill-color: var(--muted-foreground);
    }

    /* === Diff Result === */
    .diff-result-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
    }

    .diff-result-main {
      height: 36rem;
      overflow: hidden;
    }

    .diff-result-panels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--border);
      height: 100%;
      font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace;
      font-size: 13px;
      line-height: 20px;
      font-variant-ligatures: none;
      font-kerning: none;
      letter-spacing: 0;
      word-spacing: 0;
      tab-size: 2;
      -moz-tab-size: 2;
    }

    .diff-result-placeholder {
      grid-column: 1 / -1;
      padding: 1rem;
      color: var(--muted-foreground);
      background: var(--background);
    }

    .diff-result-panel {
      min-width: 0;
      overflow: auto;
      background: var(--background);
    }

    .diff-result-panel-inner {
      min-width: max-content;
    }

    .diff-result-row {
      display: flex;
      align-items: stretch;
      padding: 0;
      min-height: 20px;
      white-space: pre;
      font: inherit;
    }

    .diff-result-row code,
    .diff-result-code {
      display: inline;
      font: inherit;
      white-space: pre;
      padding-right: 0.6rem;
    }

    .diff-result-code * {
      font: inherit;
      font-variant-ligatures: inherit;
      letter-spacing: inherit;
    }

    .diff-result-lineno {
      display: inline-block;
      width: 3.25rem;
      text-align: right;
      padding: 0 0.5rem 0 0.5rem;
      color: var(--muted-foreground);
      opacity: 0.85;
      user-select: none;
      flex: none;
      position: sticky;
      left: 0;
      z-index: 2;
      background: inherit;
      font: inherit;
    }

    .diff-result-row.diff-result-added .diff-result-lineno {
      background: color-mix(in oklab, #10b981 18%, var(--background));
    }

    .diff-result-row.diff-result-removed .diff-result-lineno {
      background: color-mix(in oklab, #f43f5e 18%, var(--background));
    }

    .diff-result-row.diff-result-same .diff-result-lineno {
      background: var(--background);
    }

    .diff-result-row.diff-result-blank .diff-result-lineno {
      background: var(--background);
    }

    .diff-result-prefix {
      display: inline-block;
      width: 1rem;
      text-align: center;
      opacity: 0.5;
      user-select: none;
      flex: none;
      font: inherit;
    }

    .diff-result-block-marker {
      padding: 0.25rem 0.75rem;
      background: color-mix(in oklab, #f59e0b 14%, var(--background));
      color: color-mix(in oklab, #f59e0b 78%, var(--foreground));
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      scroll-margin-top: 4rem;
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      position: sticky;
      left: 0;
      min-width: max-content;
    }

    .diff-result-block-idx {
      flex: none;
    }

    .diff-result-block-hunk {
      flex: 1 1 auto;
      min-width: 0;
      font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
      font-weight: 500;
      opacity: 0.9;
      white-space: pre;
    }

    .diff-result-added {
      background: color-mix(in oklab, #10b981 18%, transparent);
    }

    .diff-result-removed {
      background: color-mix(in oklab, #f43f5e 18%, transparent);
    }

    .diff-result-same {
      color: color-mix(in oklab, var(--foreground) 85%, transparent);
    }

    .diff-result-blank {
      background: color-mix(in oklab, var(--muted) 30%, transparent);
    }

    .diff-result-empty {
      grid-column: 1 / -1;
      padding: 0.75rem 1rem;
      color: var(--muted-foreground);
      background: var(--background);
    }

    .diff-result-error {
      grid-column: 1 / -1;
      padding: 0.75rem 1rem;
      color: color-mix(in oklab, #ef4444 78%, var(--foreground));
      font-size: 0.875rem;
      font-weight: 500;
      background: var(--background);
    }

    .diff-result-outline {
      border-top: 1px solid var(--border);
      background: color-mix(in oklab, var(--muted) 30%, transparent);
      padding: 0.45rem 0.35rem;
    }

    .diff-result-outline-title {
      display: none;
    }

    .diff-result-outline-list {
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      justify-content: center;
      gap: 0.35rem;
      max-height: 16rem;
      overflow: auto;
    }

    .diff-result-outline-empty {
      color: var(--muted-foreground);
      font-size: 0.7rem;
      padding: 0.25rem 0.1rem;
      text-align: center;
    }

    .diff-result-outline-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.5rem;
      height: 1.5rem;
      border-radius: 999px;
      border: 1px solid color-mix(in oklab, var(--border) 86%, transparent);
      background: color-mix(in oklab, var(--background) 88%, transparent);
      color: var(--foreground);
      font-size: 0.7rem;
      font-weight: 600;
      text-decoration: none;
      line-height: 1;
      transition: transform 0.12s ease, box-shadow 0.18s ease, background-color 0.18s ease, border-color 0.18s ease;
    }

    .diff-result-outline-chip:hover {
      transform: translateY(-1px);
      box-shadow: 0 2px 6px color-mix(in oklab, var(--foreground) 12%, transparent);
    }

    .diff-result-outline-chip--add {
      background: color-mix(in oklab, #10b981 28%, var(--background));
      border-color: color-mix(in oklab, #10b981 55%, var(--border));
      color: color-mix(in oklab, #10b981 30%, var(--foreground));
    }

    .diff-result-outline-chip--remove {
      background: color-mix(in oklab, #f43f5e 28%, var(--background));
      border-color: color-mix(in oklab, #f43f5e 55%, var(--border));
      color: color-mix(in oklab, #f43f5e 30%, var(--foreground));
    }

    .diff-result-outline-chip--modify {
      background: color-mix(in oklab, #f59e0b 28%, var(--background));
      border-color: color-mix(in oklab, #f59e0b 55%, var(--border));
      color: color-mix(in oklab, #f59e0b 30%, var(--foreground));

      .diff-result-layout {
        grid-template-columns: minmax(0, 1fr) 3rem;

      .diff-result-outline {

        border-left: 1px solid var(--border);
        max-height: 36rem;
        overflow: hidden;
      }

      .diff-result-outline-list {
        max-height: calc(36rem - 1rem);
      }
    }

    .hljs {
      color: inherit;

    }
    .hljs-title,
    .hljs-section {
      color: color-mix(in oklab, #38bdf8 75%, var(--foreground));
    }
